<nav
  [ngClass]="{
    'w-[210px] xl:w-[280px]': menuService.showSideBar,
    'w-[70px]': !menuService.showSideBar && !menuService.sidebarHovered && !menuService.isHiddenSidebar,
    'w-[210px] xl:w-[280px] hover-expanded': menuService.sidebarHovered && !menuService.showSideBar && !menuService.isHiddenSidebar,
    'hidden': menuService.isHiddenSidebar,
    'sidebar-animating': true
  }"
  class="bg-background h-full flex-col justify-between pt-3 transition-all duration-300 lg:flex">
  <div class="overflow-hidden">
    <!-- Logo -->
    <div
      [ngClass]="menuService.showSideBar || menuService.sidebarHovered ? 'justify-between' : 'justify-center'"
      class="mx-4 mb-2 flex h-9 items-center">
      @if (menuService.showSideBar || menuService.sidebarHovered) {
        <div class="flex items-center">
          <a
            (click)="toggleSidebar()"
            class="bg-primary flex cursor-pointer items-center justify-center rounded-sm p-2 focus:outline-hidden focus:ring-1">
            <svg-icon src="assets/icons/logo.svg"> </svg-icon>
          </a>
          <b class="text-foreground ps-2 ml-1 grow text-sm font-bold">
            {{ appJson.displayName }}
          </b>
        </div>
      }
      <div class="flex items-center gap-1">
        <button
          (click)="toggleSidebar()"
          class="text-muted-foreground/50 hover:text-muted-foreground flex items-center justify-center rounded-md p-2 transition-all duration-200 focus:outline-hidden"
          [ngClass]="{ 'rotate-180': !menuService.showSideBar && !menuService.sidebarHovered }">
          <svg-icon src="assets/icons/heroicons/solid/chevron-double-left.svg"> </svg-icon>
        </button>
        <button
          (click)="toggleHideSidebar()"
          class="text-muted-foreground/50 hover:text-muted-foreground flex items-center justify-center rounded-md p-2 transition-all duration-200 focus:outline-hidden"
          title="Hide sidebar">
          <svg-icon src="assets/icons/heroicons/solid/x-mark.svg"> </svg-icon>
        </button>
      </div>
    </div>

    <!-- Menu Items -->
    <div
      class="scrollbar-thumb--sm scrollbar-track-rounded scrollbar-thin scrollbar-track-transparent scrollbar-thumb-card h-full overflow-auto px-4">
      <app-sidebar-menu></app-sidebar-menu>
    </div>
  </div>

  <div class="mx-4 my-4 space-y-1">
    <!-- Version -->
    <a
      target="_blank"
      href="https://github.com/luciano-work/angular-tailwind"
      class="-sm hover:bg-card group flex h-9 cursor-pointer items-center justify-start p-2">
      <svg-icon
        src="assets/icons/heroicons/outline/information-circle.svg"
        [svgClass]="'h-5 w-5 text-muted-foreground/50'">
      </svg-icon>

      <div class="ml-3 truncate text-[10px] font-semibold tracking-wide focus:outline-hidden">
        <span class="bg-primary/10 text-primary px-2 font-semibold">v{{ appJson.version }}</span>
      </div>

      @if (!menuService.showSideBar && !menuService.sidebarHovered) {
        <div class="fixed w-full">
          <span
            class="z-1 bg-foreground text-background absolute left-12 -top-4 w-auto min-w-max origin-left scale-0 p-2 text-xs font-bold shadow-md transition-all duration-200 group-hover:scale-100">
            v{{ appJson.version }}
          </span>
        </div>
      }
    </a>
  </div>
</nav>

<!-- Sidebar Hidden Toggle Button (Visible when sidebar is hidden) -->
@if (menuService.isHiddenSidebar) {
  <div class="fixed bottom-4 left-4 z-50">
    <button
      (click)="toggleHideSidebar()"
      class="bg-primary text-primary-foreground hover:bg-primary/90 flex items-center justify-center rounded-lg p-3 shadow-lg transition-all duration-200"
      title="Show sidebar">
      <svg-icon src="assets/icons/heroicons/solid/bars-3.svg"> </svg-icon>
    </button>
  </div>
}
